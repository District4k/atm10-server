name: Test then promote to prod

on:
  push:
    branches: [test]

permissions:
  contents: write

concurrency:
  group: promote-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make scripts executable
        run: chmod +x scripts/*.sh
      - name: Pack checks
        run: ./scripts/test.sh

  smoke:
    if: vars.ENABLE_SMOKE_TEST == 'true'
    needs: test
    runs-on: [self-hosted, minecraft-test]
    steps:
      - uses: actions/checkout@v4
      - name: Full server boot
        run: |
          chmod +x scripts/*.sh
          export ENABLE_SMOKE_TEST=true
          ./scripts/test.sh

  promote-to-prod:
    needs: [test, smoke]
    if: ${{ always() && needs.test.result == 'success' && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push test SHA to prod
        run: git push origin "HEAD:prod"
