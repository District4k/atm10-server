name: Deploy prod

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Client/server overlay zips for players (CurseForge pack + this overlay).
  release-overlays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build overlay zips
        run: |
          chmod +x scripts/*.sh
          sudo apt-get update -y && sudo apt-get install -y rsync zip
          ./scripts/build-overlays.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prod-${{ github.run_number }}
          name: prod ${{ github.run_number }}
          files: |
            dist/client-overlay.zip
            dist/server-overlay.zip
            dist/VERSION
          generate_release_notes: true

  # Mac self-hosted runner: blue-green Docker cutover (wait for 0 players, rollback on fail).
  deploy-live:
    if: vars.SKIP_LIVE_DEPLOY != 'true'
    needs: release-overlays
    runs-on: [self-hosted, minecraft-prod]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 0
      - name: Overlay and cut over Docker live when empty
        timeout-minutes: 10080
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh docker/entrypoint.sh
          # gitignored deploy.env lives on the Mac host; deploy.sh also loads ~/atm10-server/deploy.env
          test -f /Users/enricokallaste/atm10-server/deploy.env || test -f /Users/enricokallaste/atm10-server/.env || {
            echo "Missing host deploy.env/.env at /Users/enricokallaste/atm10-server/"
            exit 1
          }
          docker info >/dev/null
          ./scripts/deploy.sh
